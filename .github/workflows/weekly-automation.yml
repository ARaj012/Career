name: Data Automation

on:
  schedule:
    # Daily 07:00 IST — exams with registration open / exam or result within 90 days
    - cron: '30 1 * * *'
    # Sunday 05:30 IST — all exams, scholarships, NIRF ranks
    - cron: '0 0 * * 0'
    # 1st of the month 07:30 IST — 120 least-recently-checked colleges (NAAC, fees, founded); all 366 every ~3 months
    - cron: '0 2 1 * *'
    # 8th of the month 07:30 IST — 60 colleges: official admission cutoffs for every exam except JEE (JoSAA)
    - cron: '0 2 8 * *'
    # 15th of the month 07:30 IST — 50 colleges' websites: programmes & fees, placement reports, admission, scholarships
    - cron: '0 2 15 * *'
    # 22nd of the month 07:30 IST — official exam syllabus (with changes), exam cutoffs, pattern & eligibility, career facts
    - cron: '0 2 22 * *'
    # 5th of Aug, Sep, Oct 07:30 IST — official NIRF placement sheets and JoSAA cutoffs (published once a year)
    - cron: '0 2 5 8,9,10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | hot'
        default: 'hot'
      slug:
        description: 'Optional: check a single exam by slug (e.g. gate)'
        default: ''
      dry_run:
        description: 'Dry run (log only, change nothing)'
        type: boolean
        default: false
      papers:
        description: 'Also refresh previous-year papers (no AI)'
        type: boolean
        default: false
      alerts:
        description: 'Also send today''s exam reminder emails'
        type: boolean
        default: false

concurrency:
  group: data-automation
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automation
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CAREER_GUIDANCE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
          AUTOMATION_AUTO_APPLY: ${{ vars.AUTOMATION_AUTO_APPLY || 'safe' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "${{ inputs.slug }}" ] && ARGS="--slug=${{ inputs.slug }}" || ARGS="--mode=${{ inputs.mode }}"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            ARGS="--mode=hot"
          elif [ "${{ github.event.schedule }}" = "0 2 1 * *" ]; then
            ARGS="--only=colleges --limit=120"
          elif [ "${{ github.event.schedule }}" = "0 2 8 * *" ]; then
            ARGS="--only=college_cutoffs --limit=60"
          elif [ "${{ github.event.schedule }}" = "0 2 15 * *" ]; then
            ARGS="--only=college_details --limit=50"
          elif [ "${{ github.event.schedule }}" = "0 2 22 * *" ]; then
            ARGS="--only=syllabus,exam_cutoffs,exam_rules,careers --limit=60"
          elif [ "${{ github.event.schedule }}" = "0 2 5 8,9,10 *" ]; then
            ARGS="--only=placements,cutoffs"
          else
            ARGS="--mode=full --only=exams,scholarships,nirf"
          fi
          echo "Running: npx tsx scripts/automation.ts $ARGS"
          npx tsx scripts/automation.ts $ARGS | tee automation.log

      # Every morning (07:00 IST, after the date check): reminder emails and
      # in-app notifications for the exams each student tracks
      - name: Exam reminders
        if: always() && (github.event.schedule == '30 1 * * *' || inputs.alerts == true)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CAREER_GUIDANCE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERTS_FROM_EMAIL: ${{ vars.ALERTS_FROM_EMAIL }}
          ALERTS_FROM_NAME: ${{ vars.ALERTS_FROM_NAME }}
        run: npx tsx scripts/exam-alerts.ts | tee -a automation.log

      # 22nd of the month, or on request: previous-year papers and answer keys
      # from each exam's official site (link reader, no AI)
      - name: Previous-year papers
        if: always() && (github.event.schedule == '0 2 22 * *' || inputs.papers == true)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CAREER_GUIDANCE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: npx tsx scripts/papers.ts | tee -a automation.log

      - name: Summary
        if: always()
        working-directory: apps/web
        run: |
          echo "## Data automation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "Summary|Previous papers|Exam alerts|Exams to check|Scholarships to check|Colleges to check|College details|Exam syllabi|Exam cutoffs|Careers to check|JoSAA|NIRF|errors|Daily Groq|Stopped" automation.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Review queued changes in Admin → Automation." >> $GITHUB_STEP_SUMMARY
